openapi: 3.2.0
info:
  title: Hypixel Public Other API
  x-logo:
    url: https://api.hypixel.net/assets/images/logo.png
    altText: Hypixel Logo
    href: '#'
  description: '# Introduction

    This is the official Hypixel API documentation.'
  version: v2
  termsOfService: https://hypixel.net/tos
  contact:
    name: Hypixel Support
    url: https://developer.hypixel.net
  x-jentic-source-url: https://api.hypixel.net/
  x-generated-from: jentic-public-apis
  x-last-validated: '2026-05-30'
servers:
- url: https://api.hypixel.net
security:
- ApiKey: []
tags:
- name: Other
  description: Network-wide telemetry — boosters, counts, leaderboards, punishment statistics.
paths:
  /v2/boosters:
    get:
      summary: Hypixel Active Network Boosters
      tags:
      - Other
      security:
      - ApiKey: []
      responses:
        '200':
          description: Get boosters list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  boosters:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/ActiveBooster'
                      - $ref: '#/components/schemas/QueuedBooster'
                  boosterState:
                    type: object
                    properties:
                      decrementing:
                        type: boolean
              examples:
                GetBoosters200Example:
                  summary: Default getBoosters 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    boosters:
                    - example
                    boosterState:
                      decrementing: true
        '403':
          $ref: '#/components/responses/InvalidKey'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getBoosters
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Active Network Boosters
  /v2/counts:
    get:
      summary: Hypixel Current Player Counts
      tags:
      - Other
      security:
      - ApiKey: []
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  playerCount:
                    type: integer
                  games:
                    type: object
                    example:
                      GAME_TYPE:
                        players: 2
                        modes:
                          mode_1: 1
                          mode_2: 1
              examples:
                GetCounts200Example:
                  summary: Default getCounts 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    playerCount: 42
                    games:
                      GAME_TYPE:
                        players: 2
                        modes:
                          mode_1: 1
                          mode_2: 1
        '403':
          $ref: '#/components/responses/InvalidKey'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getCounts
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Current Player Counts
  /v2/leaderboards:
    get:
      summary: Hypixel Current Leaderboards
      tags:
      - Other
      security:
      - ApiKey: []
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  leaderboards:
                    type: object
              examples:
                GetLeaderboards200Example:
                  summary: Default getLeaderboards 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    leaderboards: {}
        '403':
          $ref: '#/components/responses/InvalidKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPopulated'
      operationId: getLeaderboards
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Current Leaderboards
  /v2/punishmentstats:
    get:
      tags:
      - Other
      summary: Hypixel Punishment Statistics
      security:
      - ApiKey: []
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  watchdog_lastMinute:
                    type: integer
                  staff_rollingDaily:
                    type: integer
                  watchdog_total:
                    type: integer
                  watchdog_rollingDaily:
                    type: integer
                  staff_total:
                    type: integer
              examples:
                GetPunishmentstats200Example:
                  summary: Default getPunishmentstats 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    watchdog_lastMinute: 42
                    staff_rollingDaily: 42
                    watchdog_total: 42
                    watchdog_rollingDaily: 42
                    staff_total: 42
        '403':
          $ref: '#/components/responses/InvalidKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPopulated'
      operationId: getPunishmentstats
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Punishment Statistics
components:
  responses:
    InvalidKey:
      description: Access is forbidden, usually due to an invalid API key being used.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              cause:
                type: string
                example: Invalid API key
    NotPopulated:
      description: The data is not yet populated and should be available shortly
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              cause:
                type: string
                example: Leaderboard data has not yet been populated
    RateLimited:
      description: A request limit has been reached, usually this is due to the limit on the key being reached but can also be triggered by a global throttle.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              cause:
                type: string
                example: Key throttle
              throttle:
                type: boolean
                example: true
              global:
                type: boolean
                description: When this boolean exists and is true, the throttle occurring is a global throttle applied to all users
                example: true
  schemas:
    QueuedBooster:
      allOf:
      - $ref: '#/components/schemas/Booster'
      - type: object
        properties:
          stacked:
            type:
            - boolean
            - 'null'
    ActiveBooster:
      allOf:
      - $ref: '#/components/schemas/Booster'
      - type: object
        properties:
          stacked:
            type:
            - array
            - 'null'
            items:
              type: string
              description: UUID of the player in a dashed format
              format: uuid
              example: ad8fefaa-8351-454b-b739-a4eaa872173f
    Booster:
      properties:
        _id:
          type: string
          format: objectid
          example: 5fcbf9d9d295e80a766f3b14
        purchaserUuid:
          type: string
          format: uuid
          example: ad8fefaa8351454bb739a4eaa872173f
        amount:
          type: number
          example: 1.0
        originalLength:
          type: integer
          example: 42
        length:
          type: integer
          example: 42
        gameType:
          type: integer
          example: 42
        dateActivated:
          type: integer
          format: int64
          example: 1748544600000
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: API-Key
      description: Obtained via the [Hypixel Developer Dashboard](https://developer.hypixel.net) when creating an application. You can also request higher limits for production applications in this dashboard.
