openapi: 3.2.0
info:
  title: Hypixel Public Player Data API
  x-logo:
    url: https://api.hypixel.net/assets/images/logo.png
    altText: Hypixel Logo
    href: '#'
  description: '# Introduction

    This is the official Hypixel API documentation.'
  version: v2
  termsOfService: https://hypixel.net/tos
  contact:
    name: Hypixel Support
    url: https://developer.hypixel.net
  x-jentic-source-url: https://api.hypixel.net/
  x-generated-from: jentic-public-apis
  x-last-validated: '2026-05-30'
servers:
- url: https://api.hypixel.net
security:
- ApiKey: []
tags:
- name: Player Data
  description: Hypixel network player profiles, recent games, online status, friends, and guild lookups.
paths:
  /v2/player:
    get:
      summary: Hypixel Data of a Specific Player, Including Game Stats
      tags:
      - Player Data
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: uuid
        schema:
          type: string
        required: true
        example: ad8fefaa8351454bb739a4eaa872173f
        description: The uuid parameter.
      responses:
        '200':
          description: Get player's data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  player:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 3fa85f6457174562b3fc2c963f66afa6
                      displayname:
                        type:
                        - string
                        - 'null'
                      rank:
                        type:
                        - string
                        - 'null'
                        enum:
                        - ADMIN
                        - MODERATOR
                        - HELPER
                        - NORMAL
                      packageRank:
                        type:
                        - string
                        - 'null'
                        enum:
                        - MVP_PLUS
                        - MVP
                        - VIP_PLUS
                        - VIP
                        - NONE
                      newPackageRank:
                        type:
                        - string
                        - 'null'
                        enum:
                        - MVP_PLUS
                        - MVP
                        - VIP_PLUS
                        - VIP
                        - NONE
                      monthlyPackageRank:
                        type:
                        - string
                        - 'null'
                        enum:
                        - SUPERSTAR
                        - NONE
                      firstLogin:
                        type:
                        - number
                        - 'null'
                      lastLogin:
                        type:
                        - number
                        - 'null'
                      lastLogout:
                        type:
                        - number
                        - 'null'
                      stats:
                        type:
                        - object
                        - 'null'
              examples:
                GetPlayer200Example:
                  summary: Default getPlayer 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    player:
                      uuid: 3fa85f6457174562b3fc2c963f66afa6
                      displayname: ExamplePlayer
                      rank: ADMIN
                      packageRank: MVP_PLUS
                      newPackageRank: MVP_PLUS
                      monthlyPackageRank: SUPERSTAR
        '400':
          $ref: '#/components/responses/DataMissing'
        '403':
          $ref: '#/components/responses/InvalidKey'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getPlayer
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Data of a specific player, including game stats
  /v2/recentgames:
    get:
      summary: Hypixel The Recently Played Games of a Specific Player
      tags:
      - Player Data
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: uuid
        schema:
          type: string
        required: true
        example: ad8fefaa8351454bb739a4eaa872173f
        description: The uuid parameter.
      responses:
        '200':
          description: Get player's recent game
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  uuid:
                    type: string
                    format: uuid
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: number
                          format: int64
                        gameType:
                          type: string
                        mode:
                          type: string
                        map:
                          type: string
                        ended:
                          type: number
                          format: int64
              examples:
                GetRecentgames200Example:
                  summary: Default getRecentgames 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    uuid: ad8fefaa8351454bb739a4eaa872173f
                    games:
                    - date: 1.0
                      gameType: example
                      mode: example
                      map: example
                      ended: 1.0
        '400':
          $ref: '#/components/responses/DataMissing'
        '403':
          $ref: '#/components/responses/InvalidKey'
        '422':
          $ref: '#/components/responses/MalformedData'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getRecentgames
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: The recently played games of a specific player
  /v2/status:
    get:
      summary: Hypixel The Current Online Status of a Specific Player
      tags:
      - Player Data
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: uuid
        schema:
          type: string
        required: true
        example: ad8fefaa8351454bb739a4eaa872173f
        description: The uuid parameter.
      responses:
        '200':
          description: Get player status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  uuid:
                    type: string
                    format: uuid
                    example: ad8fefaa8351454bb739a4eaa872173f
                  session:
                    type: object
                    properties:
                      online:
                        type: boolean
                      gameType:
                        type: string
                      mode:
                        type: string
                      map:
                        type: string
              examples:
                GetStatus200Example:
                  summary: Default getStatus 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    uuid: ad8fefaa8351454bb739a4eaa872173f
                    session:
                      online: true
                      gameType: example
                      mode: example
                      map: example
        '400':
          $ref: '#/components/responses/DataMissing'
        '403':
          $ref: '#/components/responses/InvalidKey'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getStatus
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: The current online status of a specific player
  /v2/guild:
    get:
      summary: Hypixel Retrieve a Guild by a Player, Id, or Name
      tags:
      - Player Data
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: id
        schema:
          type: string
          format: objectid
        example: 5fcbf9d9d295e80a766f3b14
        description: The id parameter.
      - in: query
        name: player
        schema:
          type: string
          format: uuid
        example: ad8fefaa8351454bb739a4eaa872173f
        description: The player parameter.
      - in: query
        name: name
        schema:
          type: string
        example: ExamplePlayer
        description: The name parameter.
      responses:
        '200':
          description: Get guild information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  guild:
                    type: object
              examples:
                GetGuild200Example:
                  summary: Default getGuild 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    guild: {}
        '400':
          $ref: '#/components/responses/DataMissing'
        '403':
          $ref: '#/components/responses/InvalidKey'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getGuild
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Retrieve a Guild by a player, id, or name
components:
  responses:
    DataMissing:
      description: Some data is missing, this is usually a field.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              cause:
                type: string
                example: Missing one or more fields [...]
    MalformedData:
      description: Some data provided is invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              cause:
                type: string
                example: Malformed UUID
    InvalidKey:
      description: Access is forbidden, usually due to an invalid API key being used.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              cause:
                type: string
                example: Invalid API key
    RateLimited:
      description: A request limit has been reached, usually this is due to the limit on the key being reached but can also be triggered by a global throttle.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              cause:
                type: string
                example: Key throttle
              throttle:
                type: boolean
                example: true
              global:
                type: boolean
                description: When this boolean exists and is true, the throttle occurring is a global throttle applied to all users
                example: true
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: API-Key
      description: Obtained via the [Hypixel Developer Dashboard](https://developer.hypixel.net) when creating an application. You can also request higher limits for production applications in this dashboard.
