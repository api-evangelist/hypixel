                    example: 1709874000000
                  modifier:
                    type: string
                    enum:
                    - NORMAL
                    - EXTREME
                    - SECRET
                    description: The modifier for the current bingo event
                    example: NORMAL
                  goals:
                    type: array
                    description: The goals for the current bingo event, as well as their progress
                    items:
                      type: object
