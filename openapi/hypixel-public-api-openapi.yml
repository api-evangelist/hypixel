      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  events:
                    type: array
                    items:
                      type: object
                      required:
                      - key
                      - points
                      - completed_goals
                      properties:
                        key:
                          description: The id for this event
                          type: number
                          format: int32
                          example: 2
                        points:
                          description: The amount of points earned
                          type: number
                          format: int32
                          example: 117
                        completed_goals:
                          description: The completed goal IDs
                          type: array
                          items:
                            type: string
                            example: &id003
                            - stat_walk_speed
                            - KILL_TRAPPER_MOB
              examples:
                GetSkyblockBingo200Example:
                  summary: Default getSkyblockBingo 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    events:
                    - key: 2
                      points: 117
                      completed_goals:
