paths:
  /v2/resources/games:
    get:
      summary: Hypixel Game Information
      description: Returns information about Hypixel Games. This endpoint is in early development and we are working to add more information when possible HypixelDev/PublicAPI#197
      tags:
      - Resources
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  lastUpdated:
                    type: number
                  games:
                    type: object
                    description: A map where the key is the backend name of the game
                    additionalProperties:
                      $ref: '#/components/schemas/Game'
              examples:
                GetResourcesGames200Example:
                  summary: Default getResourcesGames 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    lastUpdated: 1.0
                    games: {}
      operationId: getResourcesGames
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
