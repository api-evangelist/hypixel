vocabulary: 1.0.0
info:
  provider: Hypixel
  description: Unified vocabulary for Hypixel Public API mapping the operational dimension (OpenAPI) and the capability dimension
    (Naftiko) for the official Hypixel Minecraft network API.
  created: '2026-05-30'
  modified: '2026-05-30'
operational:
  apis:
  - name: Hypixel Public API
    namespace: hypixel
    version: v2
    baseUrl: https://api.hypixel.net
    status: active
  resources:
  - name: player
    path: /v2/player
    api: Hypixel Public API
    actions:
    - getPlayer
    tags:
    - Player Data
  - name: recentgames
    path: /v2/recentgames
    api: Hypixel Public API
    actions:
    - getRecentgames
    tags:
    - Player Data
  - name: status
    path: /v2/status
    api: Hypixel Public API
    actions:
    - getStatus
    tags:
    - Player Data
  - name: guild
    path: /v2/guild
    api: Hypixel Public API
    actions:
    - getGuild
    tags:
    - Player Data
  - name: games
    path: /v2/resources/games
    api: Hypixel Public API
    actions:
    - getResourcesGames
    tags:
    - Resources
  - name: achievements
    path: /v2/resources/achievements
    api: Hypixel Public API
    actions:
    - getResourcesAchievements
    tags:
    - Resources
  - name: challenges
