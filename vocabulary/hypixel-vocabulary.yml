  actions:
  - name: get
    httpMethod: GET
    pattern: read
    description: Fetch a resource
  - name: list
    httpMethod: GET
    pattern: query
    description: List a collection of resources
  schemas:
    boosters:
    - name: Booster
      properties:
      - _id
      - purchaserUuid
      - amount
      - originalLength
      - length
      - gameType
      - dateActivated
    - name: ActiveBooster
      properties: []
    - name: QueuedBooster
      properties: []
    skyblock:
    - name: SkyBlockAuction
      properties:
      - _id
      - uuid
      - auctioneer
      - profile_id
      - coop
      - start
      - end
      - item_name
      - item_lore
      - extra
      - category
      - tier
      - starting_bid
      - item_bytes
      - claimed
      - claimed_bidders
      - highest_bid_amount
      - bids
    - name: SkyBlockProfile
      properties:
      - profile_id
      - members
      - cute_name
      - selected
      - community_upgrades
      - banking
      - game_mode
    - name: SkyBlockItem
      properties:
      - id
      - material
      - name
      - tier
      - color
      - skin
    - name: SkyBlockMuseum
      properties:
      - value
      - appraisal
      - items
      - special
    - name: SkyBlockFireSale
      properties:
      - item_id
      - start
      - end
      - amount
      - price
    - name: SkyBlockGarden
      properties:
      - uuid
      - commission_data
      - composter_data
      - active_commissions
      - resources_collected
      - crop_upgrade_levels
      - unlocked_plots_ids
      - garden_experience
      - unlocked_barn_skins
      - selected_barn_skin
    resources:
    - name: Game
      properties:
      - id
      - name
      - databaseName
      - modeNames
      - retired
      - legacy
    housing:
    - name: HousingHouse
      properties:
      - uuid
      - owner
      - name
      - createdAt
      - players
      - cookies
  parameters:
    identifiers:
    - name: uuid
      in: query
      description: The uuid parameter.
    - name: player
      in: query
      description: The player parameter.
    - name: name
      in: query
      description: The name parameter.
    - name: profile
      in: query
      description: The profile UUID that you wish to request
    filters:
    - name: id
      in: query
      description: The id parameter.
    - name: house
      in: query
      description: The UUID of the house to get information about.
    pagination:
    - name: page
      in: query
      description: The page parameter.
  enums:
    tier:
    - COMMON
    - UNCOMMON
    - RARE
    - EPIC
    - LEGENDARY
    - MYTHIC
    - SUPREME
    - SPECIAL
    - VERY_SPECIAL
  authentication:
    schemes:
    - name: ApiKey
      type: apiKey
      in: header
      header: API-Key
    note: All endpoints require an API-Key header from the Hypixel Developer Dashboard.
capability:
  workflows:
  - name: Hypixel Public API — Housing
    file: capabilities/hypixel-public-api-housing.yaml
    description: Housing surface of the Hypixel Public API.
    api: Hypixel Public API
    tools: 3
    consumes_namespace: hypixel-public-api-housing
    rest_namespace: hypixel-public-api-housing-rest
    mcp_namespace: hypixel-public-api-housing-mcp
    tags:
    - Hypixel
    - Gaming
    - Minecraft
    - Housing
  - name: Hypixel Public API — Other
    file: capabilities/hypixel-public-api-other.yaml
    description: Other surface of the Hypixel Public API.
    api: Hypixel Public API
    tools: 4
    consumes_namespace: hypixel-public-api-other
    rest_namespace: hypixel-public-api-other-rest
    mcp_namespace: hypixel-public-api-other-mcp
    tags:
    - Hypixel
    - Gaming
    - Minecraft
    - Other
  - name: Hypixel Public API — Player Data
    file: capabilities/hypixel-public-api-player-data.yaml
    description: Player Data surface of the Hypixel Public API.
    api: Hypixel Public API
    tools: 4
    consumes_namespace: hypixel-public-api-player-data
    rest_namespace: hypixel-public-api-player-data-rest
    mcp_namespace: hypixel-public-api-player-data-mcp
    tags:
    - Hypixel
    - Gaming
    - Minecraft
    - Player Data
  - name: Hypixel Public API — Resources
    file: capabilities/hypixel-public-api-resources.yaml
    description: Resources surface of the Hypixel Public API.
    api: Hypixel Public API
    tools: 7
    consumes_namespace: hypixel-public-api-resources
    rest_namespace: hypixel-public-api-resources-rest
    mcp_namespace: hypixel-public-api-resources-mcp
    tags:
    - Hypixel
    - Gaming
    - Minecraft
    - Resources
  - name: Hypixel Public API — SkyBlock
    file: capabilities/hypixel-public-api-skyblock.yaml
    description: SkyBlock surface of the Hypixel Public API.
    api: Hypixel Public API
    tools: 16
    consumes_namespace: hypixel-public-api-skyblock
    rest_namespace: hypixel-public-api-skyblock-rest
    mcp_namespace: hypixel-public-api-skyblock-mcp
    tags:
    - Hypixel
    - Gaming
    - Minecraft
    - Skyblock
  personas:
  - id: minecraft-player
    name: Minecraft / Hypixel Player
    description: Hypixel network player looking up their own or another player's stats, profile, friends, or guild.
    workflows:
    - Hypixel Public API — Player Data
    - Hypixel Public API — Other
  - id: skyblock-trader
    name: SkyBlock Trader / Flipper
    description: SkyBlock player using auction house and bazaar data for flipping, arbitrage, and profit analysis.
    workflows:
    - Hypixel Public API — SkyBlock
  - id: tooling-developer
    name: Third-Party Tooling Developer
    description: Developer building public stats sites, Discord bots, leaderboards, or museum/collection trackers on top of
      the API.
    workflows:
    - Hypixel Public API — Player Data
    - Hypixel Public API — Resources
    - Hypixel Public API — SkyBlock
    - Hypixel Public API — Housing
    - Hypixel Public API — Other
  - id: community-moderator
    name: Community Moderator / Researcher
    description: Community moderator or researcher tracking watchdog/staff ban statistics over time.
    workflows:
    - Hypixel Public API — Other
  domains:
  - name: Player
    description: Player profiles, recent games, online status, and guild lookups.
    resources:
    - player
    - recentgames
    - status
    - guild
  - name: SkyBlock
    description: SkyBlock economy, profiles, museum, garden, bingo, fire sales.
    resources:
    - profile
    - profiles
    - auction
    - auctions
    - bazaar
    - museum
    - garden
    - bingo
    - firesales
    - news
  - name: Housing
    description: Hypixel Housing public houses.
    resources:
    - active
    - house
    - houses
  - name: Network
    description: Network-wide telemetry — counts, boosters, leaderboards, punishment statistics.
    resources:
    - counts
    - boosters
    - leaderboards
    - punishmentstats
  - name: Reference
    description: Static reference catalogs — games, achievements, challenges, quests, vanity items, SkyBlock collections/skills/items.
    resources:
    - games
    - achievements
    - challenges
    - quests
    - pets
    - companions
    - collections
    - skills
    - items
    - election
  namespaces:
    consumed:
    - hypixel-public-api-housing
    - hypixel-public-api-other
    - hypixel-public-api-player-data
    - hypixel-public-api-resources
    - hypixel-public-api-skyblock
    rest:
    - hypixel-public-api-housing-rest
    - hypixel-public-api-other-rest
    - hypixel-public-api-player-data-rest
    - hypixel-public-api-resources-rest
    - hypixel-public-api-skyblock-rest
    mcp:
    - hypixel-public-api-housing-mcp
    - hypixel-public-api-other-mcp
    - hypixel-public-api-player-data-mcp
    - hypixel-public-api-resources-mcp
    - hypixel-public-api-skyblock-mcp
  binds:
  - name: HYPIXEL_API_KEY
    workflows:
    - Hypixel Public API — Housing
    - Hypixel Public API — Other
    - Hypixel Public API — Player Data
    - Hypixel Public API — Resources
    - Hypixel Public API — SkyBlock
