    tags:
    - Resources
  - name: companions
    path: /v2/resources/vanity/companions
    api: Hypixel Public API
    actions:
    - getResourcesVanityCompanions
    tags:
    - Resources
  - name: collections
    path: /v2/resources/skyblock/collections
    api: Hypixel Public API
    actions:
    - getResourcesSkyblockCollections
    tags:
    - SkyBlock
  - name: skills
    path: /v2/resources/skyblock/skills
    api: Hypixel Public API
    actions:
