    tags:
    - SkyBlock
  - name: auction
    path: /v2/skyblock/auction
    api: Hypixel Public API
    actions:
    - getSkyblockAuction
    tags:
    - SkyBlock
  - name: auctions
    path: /v2/skyblock/auctions
